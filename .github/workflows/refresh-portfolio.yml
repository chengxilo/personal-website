name: Refresh portfolio data

on:
  schedule:
    - cron: '17 6 * * *'   # daily at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-portfolio
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_USER: chengxilo
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Always start from the latest main, even when re-running an old run.
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run fetch_prs.py
        run: python scripts/fetch_prs.py

      - name: Commit changes (only if data changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # portfolio.json is fully regenerated, so if main moved during the run,
          # reset onto it and regenerate instead of merging.
          for attempt in 1 2 3; do
            if git diff --quiet -- app/data/portfolio.json; then
              echo "No changes to portfolio.json"
              exit 0
            fi
            git add app/data/portfolio.json
            git commit -m "chore: refresh portfolio data"
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); regenerating on top of latest main"
            git fetch origin main
            git reset --hard origin/main
            python scripts/fetch_prs.py
          done
          echo "Giving up after 3 attempts"
          exit 1
